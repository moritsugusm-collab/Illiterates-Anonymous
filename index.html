<head> <!--This is the header of the page-->

    rel="stylesheet"
    href="style.css"
  > <!-- This links the external CSS file -->
  <script src="script.js" defer></script> <!-- this links the JS script?-->

<body>
  <main class="achievements">
    <header>
      <h1>Books</h1>
      <p>
        See which books someone has read.
      </p>
    </header>

        <!-- Person selector -->
    <div class="person-selector">
      <!-- <label for="person">Select a reader</label> (Me personally i think this is ugly)-->

      <select id="person" name="person">
        <option value="">Choose a person...</option>
        <option value="Bass">Bass</option>
        <option value="Baxter">Baxter</option>
        <option value="Ethan">Ethan</option>
        <option value="Hayder">Hayder</option>
        <option value="Karina">Karina</option>
        <option value="Lyvia">Lyvia</option>
        <option value="Mac">Mac</option>
        <option value="Maren">Maren</option>
        <option value="Saf">Saf</option>
        <option value="Sam">Sam</option>
        <option value="Tira">Tira</option>
        <option value="Zaki">Zaki</option>
      </select>
    </div>

    <!-- Page heading hidden
    <header class="heading">
      <span>Reading Achievements</span>
      <span
        class="info"
        title="Achievements update based on the selected reader's books."
        aria-label="Information"
      >i</span>
    </header>
    -->

<!-- Keep this section so JavaScript can display books -->
<section
  id="bookList"
  class="grid"
  aria-label="Reading achievements"
  aria-live="polite"
></section>

    
    <!-- Your JavaScript displays errors here -->
    <p id="error" class="error hidden" role="alert"></p>

  </main>
