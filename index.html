<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Checker</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
  
<body>
<!-- Open menu button -->
<button id="menu-open" class="menu-open"
        aria-label="Open menu"
        aria-controls="site-menu"
        aria-expanded="false">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Full-screen navigation -->
<nav id="site-menu" class="menu-overlay"
     aria-label="Main navigation" hidden>

  <button id="menu-close" class="menu-close"
          aria-label="Close menu">
    ×
  </button>

  <div class="menu-layout">
    <h1 class="menu-heading">Nav</h1>

    <a class="menu-link" href="home.html">
      <span>Home</span>
    </a>

    <a class="menu-link" href="new-book-vote.html">
      <span>New Book Vote</span>
    </a>

    <a class="menu-link" href="about.html">
      <span>About</span>
    </a>

    <a class="menu-link menu-link-tilted"
       href="bookmarks-challenge.html">
      <span>2026 Bookmarks Challenge</span>
    </a>

    <!--<img class="menu-plant"
         src="images/plant-illustration.svg"
         alt="">-->
  </div>
</nav>
        
  <main class="achievements">
    <header>
      <h1>Books</h1>
      <p>
        See which books someone has read.
      </p>
    </header>

        <!-- Person selector -->
    <div class="person-selector">
      <!-- <label for="person">Select a reader</label> (Me personally i think this is ugly)-->

      <select id="person" name="person">
        <option value="">Choose a person...</option>
        <option value="Bass">Bass</option>
        <option value="Baxter">Baxter</option>
        <option value="Ethan">Ethan</option>
        <option value="Hayder">Hayder</option>
        <option value="Karina">Karina</option>
        <option value="Lyvia">Lyvia</option>
        <option value="Mac">Mac</option>
        <option value="Maren">Maren</option>
        <option value="Saf">Saf</option>
        <option value="Sam">Sam</option>
        <option value="Tira">Tira</option>
        <option value="Zaki">Zaki</option>
      </select>
    </div>

    <!-- Page heading hidden
    <header class="heading">
      <span>Reading Achievements</span>
      <span
        class="info"
        title="Achievements update based on the selected reader's books."
        aria-label="Information"
      >i</span>
    </header>
    -->

<!-- Keep this section so JavaScript can display books -->
<section
  id="bookList"
  class="grid"
  aria-label="Reading achievements"
  aria-live="polite"
></section>

    
    <!-- Your JavaScript displays errors here -->
    <p id="error" class="error hidden" role="alert"></p>

  </main>

<!-- Achievement details popup -->
<div
  id="bookModal"
  class="modal hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalTitle"
>
  <div class="modal-content">

    <button
      id="modalClose"
      class="modal-close"
      type="button"
      aria-label="Close popup"
    >&times;</button>

    <h2 id="modalTitle"></h2>

    <div class="modal-feature">
      <img id="modalBookmark" src="" alt="Achievement bookmark">

      <p id="modalDescription"></p>
    </div>

    <h3>Books in this collection</h3>

    <div id="modalBooks" class="modal-books"></div>

  </div>
</div>
  
</body>
</html>
