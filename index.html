<head> <!--This is the header of the page-->
  <meta charset="UTF-8">
  <meta 
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Book Checker</title> <!--THIS IS THE TITLE OF THE PAGE (goodreads has achievements)-->
  <link
    rel="stylesheet"
    href="style.css"
  > <!-- This links the external CSS file -->
</head>


<body>
  <main class="container">
    <header>
      <h1>Books</h1>
      <p>
        See which books someone has read.
      </p>
    </header>


    <section class="person-selector">
      <label for="person">
        Person
      </label>
      <select id="person">
        <option value="Bass">Bass</option>
        <option value="Baxter">Baxter</option>
        <option value="Ethan">Ethan</option>
        <option value="Hayder">Hayder</option>
        <option value="Karina">Karina</option>
        <option value="Lyvia">Lyvia</option>
        <option value="Mac">Mac</option>
        <option value="Maren">Maren</option>
        <option value="Saf">Saf</option>
        <option value="Sam">Sam</option>
        <option value="Tira">Tira</option>
        <option value="Zaki">Zaki</option>
      </select>
    </section>


    <div
      id="bookList"
      class="book-list"
    >

      <div class="loading">
        Checking books...
      </div>

    </div>


    <div
      id="error"
      class="error hidden"
    ></div>

  </main>


  <script src="app.js"></script>

</body>

</html>
